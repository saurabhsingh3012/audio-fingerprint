[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "audio-fingerprint"
version = "0.1.0"
description = "Shazam-style acoustic fingerprinting and retrieval, evaluated on a synthetic corpus."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Saurabh Singh", email = "singh.saurabh3012@gmail.com" }]
keywords = ["audio", "fingerprinting", "shazam", "dsp", "information-retrieval", "mir"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.26,<2.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/saurabhsingh3012/audio-fingerprint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ANN", "C4", "SIM"]
ignore = [
    "ANN401",  # allow typing.Any where a numpy array is passed loosely
    "B905",    # zip strict= is used where it matters; not forcing everywhere
    "C408",    # dict(a=1, b=2) is used deliberately for readable record building
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN001", "ANN201", "ANN202", "B018", "SLF001"]
"examples/*" = ["ANN001", "ANN201", "ANN202"]
"src/audio_fingerprint/index.py" = ["SLF001"]
